name: Build and Test

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  build:
    name: Build and Test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Verify Bazel version
        run: |
          echo "Bazel executable: $(which bazel)"
          bazel --version
          echo "Expected version from .bazelversion: $(cat .bazelversion)"

      - name: Get Bazel cache directory
        id: bazel-cache-dir
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "dir=/private/var/tmp/_bazel_$USER" >> $GITHUB_OUTPUT
          else
            echo "dir=~/.cache/bazel" >> $GITHUB_OUTPUT
          fi
      
      - name: Cache bazel build results
        uses: actions/cache@v3
        with:
          path: ${{ steps.bazel-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Build
        run: bazel build //src:djinni

      - name: Generate examples / check clean output
        run: ./ci/generate.sh

      - name: Test
        run: ./ci/run-tests.sh

      - name: Codegen Rule Tests
        run: bazel test --test_output=errors //bzl/tests:rule_tests

      - name: Generated Consumers
        run: bazel build //:djinni-codegen-consumer-verification //test-suite:testsuite-main-djinni-codegen

      - name: Swift Bridge Consumer
        working-directory: examples/ios
        run: bazel build //:textsort-swift-bridge

      - name: WASM Generated Consumers
        working-directory: examples/wasm
        run: bazel build //:codegen-consumer-verification

      - name: External Test
        run: bash ci/test-external-consumer.sh

  external-consumer-linux:
    name: Platform-neutral external consumer (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: bazel-contrib/setup-bazel@0.15.0
      - run: bash ci/test-external-consumer.sh
