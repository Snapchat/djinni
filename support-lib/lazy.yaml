  generic: true
  hash: '%s.hashCode()'
jni:
  translator: '::djinni::LazyAdaptor'
  header: '"$Lazy_jni.hpp"'
  typename: jobject
  typeSignature: 'Lcom/google/common/base/Supplier;'
wasm:
