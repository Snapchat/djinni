name: lazy
typedef: 'record'
params: [T]
prefix: ''
cpp:
  typename: '::djinni::Lazy'
  header: '"$Lazy.hpp"'
  byValue: false
  moveOnly: false
objc:
  typename: 'DJLazy'
  header: '"$DJLazy.h"'
