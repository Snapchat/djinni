  translator: '::djinni::LazyAdaptor'
  header: '"$Lazy_wasm.hpp"'
ts:
  typename: 'Lazy'
  module: '@djinni_support/Lazy'
  generic: true
valdi:
  translator: '::djinni::valdi::LazyAdaptor'
  header: '"$Lazy_valdi.hpp"'
swift:
