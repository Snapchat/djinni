schema_version: 1

languages:
  cpp:
    namespace: testsuite
    optional_template: std::experimental::optional
    optional_header: '"../../handwritten-src/cpp/optional.hpp"'
    nullopt_value: std::experimental::nullopt
    extended_record_include_prefix: ../../handwritten-src/cpp/
    identifiers:
      enum_type: foo_bar
  c:
    namespace: testsuite_
  java:
    package: com.dropbox.djinni.test
    nullable_annotation: javax.annotation.CheckForNull
    nonnull_annotation: javax.annotation.Nonnull
    use_final_for_record: false
    implement_android_os_parcelable: true
    implement_android_os_parcelable: true
    identifiers:
      field: mFooBar
  jni:
    use_on_load_initializer: false
    identifiers:
      class: NativeFooBar
      file: NativeFooBar
  objc:
    type_prefix: DB
  wasm:
    namespace: testsuite
  ts:
    module: test
  swift:
    module: TestSuite
    private_in_same_module: true
    private_in_same_module: true
  swiftxx:
    identifiers:
      class: NativeFooBar
      file: NativeFooBar
  yaml:
    output_file: yaml-test.yaml
    prefix: test_
